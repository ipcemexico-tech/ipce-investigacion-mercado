name: Agregar gráficos al Dashboard (una sola vez)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  graficos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Agregar gráficos al Dashboard_IPCE
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/agregar_graficos_dashboard.py
