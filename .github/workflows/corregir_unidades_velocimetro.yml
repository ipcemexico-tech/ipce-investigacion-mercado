name: Corregir unidades del velocímetro de mercado (una sola vez)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Corregir unidades en Resumen (B22:B24)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/corregir_unidades_velocimetro.py
