name: Actualización IPCE (INPC / DENUE)

on:
  schedule:
    # INPC — mensual (Anexo A.5). Día 3 de cada mes, 09:17 UTC.
    - cron: "17 9 3 * *"
    # DENUE — trimestral (Anexo A.5). Día 3 de ene/abr/jul/oct, 10:23 UTC.
    - cron: "23 10 3 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      target:
        description: "Qué consultar manualmente"
        required: true
        default: "inpc"
        type: choice
        options:
          - inpc
          - denue
      actualizar_celdas_dashboard:
        description: "Actualizar también las celdas visibles del Dashboard (Macro/Resumen/Sector_Competencia), no solo Auto_Log — úsalo para probar antes de activarlo en las corridas programadas"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Interruptor del respaldo por IA (ver docs/como_activar_respaldo_ia.md).
  # Apagado por defecto — así el sistema no genera ningún costo ni cambia
  # de comportamiento. Cambiar a "true" solo cuando quieras activarlo.
  RESPALDO_IA_ACTIVO: "false"
  # Interruptor de escritura en celdas visibles del Dashboard, además de
  # Auto_Log (ver ipce_market_research/dashboard_updater.py). Apagado por
  # defecto en las corridas PROGRAMADAS hasta confirmar con una corrida
  # manual (usando el input de arriba) que escribe donde debe.
  ACTUALIZAR_CELDAS_DASHBOARD: "false"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Determinar objetivo
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 9 3 * *" ]; then
            echo "target=inpc" >> "$GITHUB_OUTPUT"
          else
            echo "target=denue" >> "$GITHUB_OUTPUT"
          fi

      - name: Consultar y guardar snapshot
        env:
          INEGI_INDICADORES_TOKEN: ${{ secrets.INEGI_INDICADORES_TOKEN }}
          INEGI_DENUE_TOKEN: ${{ secrets.INEGI_DENUE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTUALIZAR_CELDAS_DASHBOARD: ${{ github.event_name == 'workflow_dispatch' && inputs.actualizar_celdas_dashboard || 'false' }}
        run: python scripts/run_snapshot.py --target ${{ steps.target.outputs.target }}

      - name: Commitear snapshot si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Snapshot automático (${{ steps.target.outputs.target }}) $(date -u +%Y-%m-%d)"
            git push
          fi
